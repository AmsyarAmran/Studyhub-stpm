name = "studyhub-sya"
main = "src/index.js"
compatibility_date = "2026-11-14"
workers_dev = true

[vars]
CORS_ORIGIN = "https://amsyaramran.github.io"
SUPABASE_URL = "https://pkfbvfymrlxklgdmydqe.supabase.co"
AI_MODEL = "@cf/zai-org/glm-4.7-flash"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "DAILY_QUOTA"
class_name = "DailyQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyQuota"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
